name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: RadioSharkKit build
        working-directory: RadioSharkKit
        run: swift build

      - name: RadioSharkKit tests
        working-directory: RadioSharkKit
        run: swift test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (radioORCA.xcodeproj)
        run: |
          xcodebuild build \
            -project radioORCA.xcodeproj \
            -scheme radioORCA \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
