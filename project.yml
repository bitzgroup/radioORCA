name: radioORCA
options:
  bundleIdPrefix: jp.co.bitz
  deploymentTarget:
    macOS: "13.0"
  # Base language is English; Japanese is provided as a localization
  # (Localizable.xcstrings + ja.lproj/InfoPlist.strings).
  developmentLanguage: en

packages:
  RadioSharkKit:
    path: RadioSharkKit

targets:
  radioORCA:
    type: application
    platform: macOS
    sources:
      - path: App/radioORCA
    dependencies:
      - package: RadioSharkKit
        product: RadioSharkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.bitz.radioORCA
        PRODUCT_NAME: radioORCA
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        # App/radioORCA/Assets.xcassets/AppIcon.appiconset。オリジナルデザイン
        # （オルカのシルエット）。SVGソースは App/radioORCA/Resources/AppIcon.svg。
        # Griffin純正アプリの意匠は参照・複製していない
        # （docs/app-feature-spec.md §0参照）。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Mic-access permission text, needed once audio capture (Phase 2) is
        # implemented; radioSHARK exposes itself as a standard USB audio input.
        # Base value here is English; the Japanese translation lives in
        # App/radioORCA/ja.lproj/InfoPlist.strings.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "radioORCA needs microphone (USB audio) access to play and record audio from radioSHARK."
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XKY95WKF3J
        # 意図的にApp Sandboxのentitlementを付与していない(= 非サンドボックス)。
        # docs/implementation-plan.md の配布方針(Developer ID署名 + notarize、
        # GitHub Releasesでの直接配布)を参照。
    entitlements:
      path: App/radioORCA/radioORCA.entitlements
      properties:
        # Hardened Runtime(上記ENABLE_HARDENED_RUNTIME)はApp Sandboxとは別に、
        # マイク(オーディオ入力)アクセスにこのエンタイトルメントを要求する。
        # 無いとTCCはダイアログも出さず黙ってkTCCServiceMicrophoneを拒否する
        # (2026-08-16、実機で無音の原因として特定。tccdログの
        # "Prompting policy for hardened runtime; ... requires entitlement
        # com.apple.security.device.audio-input but it is missing" で確認)。
        com.apple.security.device.audio-input: true

schemes:
  radioORCA:
    build:
      targets:
        radioORCA: all
    run:
      config: Debug
    test:
      config: Debug
